name: CI

# Mirrors the ecosystem gates (exfer-py / exfer-swap): typecheck + test + lint +
# format-check, all required to merge. The §9 conformance-vector corpus and the
# reference-store runs land as later stages add the engine and adapters; the
# structure tests already validate the vector fixtures here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck + test + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (not 20): node:test '**' glob discovery requires Node >= 21.
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Typecheck (strict — includes the F8 type-error test)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format-check
