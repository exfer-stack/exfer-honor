name: CI

# Mirrors the ecosystem gates (exfer-py / exfer-swap): typecheck + test + lint +
# format-check, all required to merge. Stage 6 wires the §9 conformance harness:
# the 21-vector corpus now EXECUTES against BOTH reference stores (the in-memory
# fake AND the real SqliteStore) and runs on EVERY push (all branches) + every PR.
# The conformance run is part of `npm test`; the dedicated `npm run conformance`
# step makes the §9 both-reference-stores gate explicit and visible in CI.

on:
  push:
  pull_request:

jobs:
  check:
    name: typecheck + test + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (not 20): node:test '**' glob discovery requires Node >= 21.
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Typecheck (strict — includes the F8 type-error test, deliver.test-d.ts)
        run: npm run typecheck
      - name: Test (full suite — includes the §9 conformance run)
        run: npm test
      - name: Conformance (§9 — 21 vectors × both reference stores: fake + SqliteStore)
        run: npm run conformance
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format-check
